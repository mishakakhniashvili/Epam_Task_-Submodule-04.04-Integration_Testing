spring.application.name=gym-crm
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=gym-crm

security.jwt.secret-base64=${JWT_SECRET_BASE64}
security.jwt.expiration-minutes=30

security.login.max-failed-attempts=3
security.login.block-duration-minutes=5

security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

workload.outbox.scheduling.enabled=true
workload.outbox.dispatch-delay=1000
workload.outbox.batch-size=100

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
workload.queue.name=${WORKLOAD_QUEUE_NAME:trainer.workload.events}
