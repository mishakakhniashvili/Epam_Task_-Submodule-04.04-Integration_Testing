spring.application.name=trainer-workload-service
server.port=8081

security.jwt.secret-base64=${JWT_SECRET_BASE64}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{transactionId:-NO-TRANSACTION-ID}] %logger{36} - %msg%n

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
workload.queue.name=${WORKLOAD_QUEUE_NAME:trainer.workload.events}
spring.jms.pub-sub-domain=false
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/trainer_workload}
spring.data.mongodb.auto-index-creation=true
